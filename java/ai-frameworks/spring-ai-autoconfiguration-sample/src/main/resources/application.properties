spring.application.name=spring-ai-oracle-autoconfiguration-sample
spring.main.web-application-type=none
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.show-sql: true

spring.ai.model.embedding=oracle
spring.ai.vectorstore.type=oracle

spring.ai.oracle.embedding.options.dimensions=${ORACLE_EMBEDDING_DIMENSIONS:384}
spring.ai.oracle.embedding.options.batching=${ORACLE_EMBEDDING_BATCHING:false}
spring.ai.oracle.embedding.options.model=${ORACLE_EMBEDDING_MODEL:ALL_MINILM_L12_V2}
spring.ai.oracle.embedding.preferences.provider=database
spring.ai.oracle.embedding.preferences.model=${ORACLE_EMBEDDING_MODEL:ALL_MINILM_L12_V2}
spring.ai.oracle.embedding.initialize-on-startup=${ORACLE_ONNX_LOAD_ON_STARTUP:true}
spring.ai.oracle.embedding.onnx-model-name=${ORACLE_ONNX_MODEL_NAME:ALL_MINILM_L12_V2}
spring.ai.oracle.embedding.onnx-uri=${ORACLE_ONNX_URI:https://adwc4pm.objectstorage.us-ashburn-1.oci.customer-oci.com/p/iPX9W0MZeRkwJKWdFmdJCemmN-iKAl_bFvNGYLW7YqIrw4kKsukL24J2q93Beb9S/n/adwc4pm/b/OML-ai-models/o/all_MiniLM_L12_v2.onnx}
spring.ai.oracle.embedding.onnx-directory-alias=${ORACLE_ONNX_DIRECTORY_ALIAS:}

spring.ai.oracle.document-loader.resource=classpath:${sample.oracle.source-document-resource}
spring.ai.oracle.document-loader.preferences.format=TEXT

spring.ai.oracle.document-splitter.preferences.by=${ORACLE_CHUNK_BY:words}
spring.ai.oracle.document-splitter.preferences.max=${ORACLE_CHUNK_MAX:80}
spring.ai.oracle.document-splitter.preferences.overlap=${ORACLE_CHUNK_OVERLAP:16}
spring.ai.oracle.document-splitter.preferences.split=${ORACLE_CHUNK_SPLIT:sentence}
spring.ai.oracle.document-splitter.preferences.vocabulary=${ORACLE_CHUNK_VOCABULARY:}
spring.ai.oracle.document-splitter.preferences.language=${ORACLE_CHUNK_LANGUAGE:american}
spring.ai.oracle.document-splitter.preferences.normalize=${ORACLE_CHUNK_NORMALIZE:all}
spring.ai.oracle.document-splitter.preferences.extended=${ORACLE_CHUNK_EXTENDED:true}

spring.ai.vectorstore.oracle.table-name=${sample.oracle.vector-table-name}
spring.ai.vectorstore.oracle.dimensions=${ORACLE_EMBEDDING_DIMENSIONS:384}
spring.ai.vectorstore.oracle.distance-type=COSINE
spring.ai.vectorstore.oracle.forced-normalization=true
spring.ai.vectorstore.oracle.initialize-schema=true
spring.ai.vectorstore.oracle.remove-existing-vector-store-table=${ORACLE_VECTORSTORE_REMOVE_EXISTING_TABLE:true}

spring.ai.session.repository.jdbc.platform=oracle
spring.ai.session.repository.jdbc.initialize-schema=always
spring.ai.session.repository.jdbc.continue-on-error=true

sample.oracle.vector-table-name=${ORACLE_VECTORSTORE_TABLE_NAME:SPRING_AI_ORACLE_SAMPLE_STORE}
sample.oracle.source-document-resource=${ORACLE_SOURCE_DOCUMENT_RESOURCE:sample-documents/oracle-sample.md}
sample.oracle.vector-store-add-batch-size=${ORACLE_VECTORSTORE_ADD_BATCH_SIZE:16}
sample.oracle.session-id=${ORACLE_SAMPLE_SESSION_ID:oracle-sample-session}
sample.oracle.user-id=${ORACLE_SAMPLE_USER_ID:oracle-sample-user}
sample.oracle.retrieval-top-k=${ORACLE_RETRIEVAL_TOP_K:3}
sample.oracle.retrieval-similarity-threshold=${ORACLE_RETRIEVAL_SIMILARITY_THRESHOLD:0.2}
sample.oracle.ollama-base-url=${OLLAMA_BASE_URL:http://localhost:11434}
sample.oracle.ollama-chat-model=${OLLAMA_CHAT_MODEL:qwen3:8b}
sample.oracle.ollama-chat-max-tokens=${OLLAMA_CHAT_MAX_TOKENS:512}
sample.oracle.ollama-chat-thinking-enabled=${OLLAMA_CHAT_THINKING_ENABLED:false}
